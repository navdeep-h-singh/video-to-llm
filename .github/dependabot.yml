# Kept deliberately quiet. This project pins through `uv.lock`, and a stream of
# individual dependency bumps on a repository with one maintainer is noise that
# buries the reports that matter. Monthly, grouped, and only where an update is
# something a human should look at.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      # One PR for the whole runtime, one for the tooling. A pipeline that
      # depends on FFmpeg, faster-whisper and ctranslate2 either works together
      # or does not, so they are worth reviewing together.
      runtime:
        dependency-type: "production"
      development:
        dependency-type: "development"
    open-pull-requests-limit: 2

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
    ignore:
      # The base image has to stay inside `requires-python` in pyproject.toml,
      # which is `>=3.11,<3.14`. Dependabot cannot see that constraint and
      # opened a PR moving the container to 3.14-slim, where `uv sync` would
      # refuse to resolve at all. Lift this the moment the ceiling moves —
      # it is a pin against a stale constraint, not against new Pythons.
      - dependency-name: "python"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
