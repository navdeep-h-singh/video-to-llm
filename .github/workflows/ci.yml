name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# Pull requests receive no credentials of any kind. Nothing in this pipeline
# needs one: every test runs against synthetic media and mocked providers.
permissions:
  contents: read

env:
  # Fail loudly rather than silently reaching the network during tests.
  VIDEO_TO_LLM_NO_NETWORK: "1"

jobs:
  test:
    name: ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
        python: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg --no-progress -y

      - name: Sync locked dependencies
        run: uv sync --locked --extra dev

      - name: Format check
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy app

      - name: Tests
        run: uv run pytest -q --deselect tests/integration/test_live_ollama.py

      - name: Pre-publish audit
        run: uv run python scripts/pre_publish_audit.py

      - name: Synthetic smoke test (no network)
        run: uv run video-to-llm smoke-test

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: .gitleaks.toml
