[project]
name = "video-to-llm"
version = "1.0.0rc1"
description = "Turn hours of local video into timestamped, citable, LLM-ready text. Fully offline. Resumable."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
keywords = [
    "llm", "video", "whisper", "ffmpeg", "transcription", "local-first",
    "privacy", "offline", "rag", "ollama", "mcp", "multimodal",
    "video-analysis", "context-engineering",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Legal Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.17",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "keyring>=25.5",
    "tomli-w>=1.0",
    "faster-whisper>=1.1",
    "pillow>=11.0",
    "filelock>=3.16",
]

# `scripts/pre_publish_audit.py --release` refuses while any placeholder owner
# remains, so a release cannot carry a dead link.
[project.urls]
Homepage = "https://github.com/navdeep-h-singh/video-to-llm"
Documentation = "https://github.com/navdeep-h-singh/video-to-llm/tree/main/docs"
Source = "https://github.com/navdeep-h-singh/video-to-llm"
Issues = "https://github.com/navdeep-h-singh/video-to-llm/issues"
Changelog = "https://github.com/navdeep-h-singh/video-to-llm/releases"

[project.optional-dependencies]
# The MCP server is optional so the core install stays free of a dependency
# only agent hosts need. `video-to-llm mcp` says so when it is missing.
mcp = [
    "mcp>=1.2",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-requests",
    "respx>=0.21",
    "pre-commit>=4.0",
    # So CI exercises the MCP transport, not only the plain tool functions.
    "mcp>=1.2",
]

[project.scripts]
video-to-llm = "app.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.build.targets.sdist]
# The skill and the docs ship with the source distribution: a skill host that
# vendors from sdist needs SKILL.md, and the limitations in docs/ are part of
# what the package claims about itself.
include = [
    "app", "config", "docs", "skills", "scripts",
    "README.md", "LICENSE", "CHANGELOG.md", "CITATION.cff", "server.json",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "PTH", "RUF", "S"]
ignore = ["S101", "S603", "S607", "N818"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI declares form, query, and path parameters by calling these in the
# argument default. B008 exists to catch accidental shared mutable defaults,
# which this idiom is not.
extend-immutable-calls = [
    "fastapi.Form",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Depends",
    "fastapi.Header",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "E501"]
"scripts/**" = ["S"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = ["^tests/fixtures/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "slow: tests that take more than a few seconds",
    "live_ollama: opt-in tests that require a running local Ollama with a vision model",
]
