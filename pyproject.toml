[project]
name = "video-to-llm"
version = "1.0.0"
description = "Localhost-only pipeline turning local videos into timestamped, reviewable, LLM-ready evidence and ordered collections."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.17",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "keyring>=25.5",
    "tomli-w>=1.0",
    "faster-whisper>=1.1",
    "pillow>=11.0",
    "filelock>=3.16",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-requests",
    "respx>=0.21",
]

[project.scripts]
video-to-llm = "app.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "PTH", "RUF", "S"]
ignore = ["S101", "S603", "S607", "N818"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI declares form, query, and path parameters by calling these in the
# argument default. B008 exists to catch accidental shared mutable defaults,
# which this idiom is not.
extend-immutable-calls = [
    "fastapi.Form",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Depends",
    "fastapi.Header",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "E501"]
"scripts/**" = ["S"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = ["^tests/fixtures/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "slow: tests that take more than a few seconds",
    "live_ollama: opt-in tests that require a running local Ollama with a vision model",
]
